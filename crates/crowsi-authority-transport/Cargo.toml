[package]
description = "Opaque signed envelopes over bounded mutually authenticated TLS"
readme = "README.md"
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-authority-transport"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = ["crates-io"]
autotests = false

license = "Apache-2.0"
repository = "https://github.com/crowsi-net/crowsi-transport-foundation"


[dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
hex = "=0.4.3"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "=1.14.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.8.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"

[[test]]
name = "mtls_loopback"
path = "tests/mtls_loopback.rs"

[[test]]
name = "neutral_surface"
path = "tests/neutral_surface.rs"

[[test]]
name = "service_locator"
path = "tests/service_locator.rs"
