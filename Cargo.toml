[package]
name = "crowsi-transport-foundation"
version = "0.10.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Bounded local framing, delivery identities and transport lifecycle"
repository = "https://github.com/crowsi-net/crowsi-transport-foundation"
publish = ["ecosystem-private"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "contract.json", "LICENSE", "NOTICE"]

[workspace]

[dependencies]
tokio = { version = "1.49", features = ["io-util", "sync", "time"], optional = true }
rustix = { version = "1.1.4", features = ["process"], optional = true }
bytes = { version = "1.10.1", optional = true }
http = { version = "1.3.1", optional = true }
httparse = { version = "1.10.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
tracing = { version = "0.1.44", optional = true }
zstd = { version = "0.13", optional = true }
zeroize = { version = "1.8.2", optional = true }

[features]
default = []
async-io = ["dep:tokio"]
process = ["dep:rustix"]
http-contract = ["dep:bytes", "dep:http", "dep:serde", "dep:serde_json", "dep:tracing", "dep:zeroize", "dep:zstd"]
loopback-http = ["async-io", "dep:httparse"]

[dev-dependencies]
tokio = { version = "1.49", features = ["io-util", "macros", "rt", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"
