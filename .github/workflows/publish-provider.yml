name: Publish provider HTTP control with OIDC
on:
  workflow_dispatch:
    inputs:
      expected-source-sha:
        type: string
        required: true
        description: Reviewed main SHA
permissions:
  contents: read
concurrency:
  group: provider-http-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.binding.outputs.sha256 }}
      filename: ${{ steps.binding.outputs.filename }}
    steps:
      - name: Require exact reviewed source without publication identity
        env:
          EXPECTED_SHA: ${{ inputs.expected-source-sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          test -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - name: Verify source and isolated candidate without OIDC
        working-directory: packages/crowsi-provider-http-transport
        run: |
          npm ci --ignore-scripts --workspaces=false
          npm run check --workspaces=false
          npm test --workspaces=false
          node ../../.github/scripts/provider-consumer.mjs
      - name: Bind prepared archive
        id: binding
        working-directory: packages/crowsi-provider-http-transport
        run: node ../../.github/scripts/prepare-provider-artifact.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: provider-prepared-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-release/*.tgz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Recheck reviewed source and OIDC context
        env:
          EXPECTED_SHA: ${{ inputs.expected-source-sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/provider-release
      - name: Publish only the exact prepared archive
        working-directory: packages/crowsi-provider-http-transport
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.sha256 }}
          PREPARED_FILENAME: ${{ needs.prepare.outputs.filename }}
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: node ../../.github/scripts/publish-provider.mjs "$RUNNER_TEMP/provider-release/$PREPARED_FILENAME"
