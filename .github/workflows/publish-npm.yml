name: Release npm package from version tag
on:
  push:
    tags: ['v*', 'npm/**']
  pull_request:
    paths: ['.github/registry-release.json', '.github/scripts/release_plan.py', '.github/scripts/test_release_plan.py', '.github/scripts/archive_binding.py', '.github/scripts/test_archive_binding.py', '.github/scripts/stage_notification.py', '.github/scripts/test_stage_notification.py', '.github/workflows/publish-npm.yml']
  workflow_dispatch:
    inputs:
      approval-batch:
        description: Optional review group; empty means individual approval. Does not bypass npm approval.
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/test_release_plan.py
          python3 .github/scripts/test_archive_binding.py
          python3 .github/scripts/test_stage_notification.py
  prepare:
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && github.event.repository.private == false
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-name: ${{ steps.archive.outputs.archive-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the exact tag and successful default-branch CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plan.py npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0 pnpm@10.29.3
      - name: Build and pack the selected package without publication identity
        env:
          INSTALL_DIRECTORY: ${{ steps.plan.outputs.install-directory }}
          PACKAGE_DIRECTORY: ${{ steps.plan.outputs.directory }}
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          if test -f "$INSTALL_DIRECTORY/pnpm-lock.yaml"; then
            pnpm --dir "$INSTALL_DIRECTORY" install --frozen-lockfile --ignore-scripts
            pnpm --dir "$INSTALL_DIRECTORY" -r --include-workspace-root --if-present run build
          elif test -f "$INSTALL_DIRECTORY/package-lock.json"; then
            npm --prefix "$INSTALL_DIRECTORY" ci --ignore-scripts
            npm --prefix "$INSTALL_DIRECTORY" run build --if-present
          else
            echo 'A committed dependency lock is required'; exit 1
          fi
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm_config_ignore_scripts=true pnpm --dir "$PACKAGE_DIRECTORY" pack --pack-destination "$RUNNER_TEMP/npm-release"
      - name: Bind archive identity and digest
        id: archive
        run: python3 .github/scripts/archive_binding.py prepare npm "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-public
    outputs:
      stage-id: ${{ steps.publication.outputs.stage-id }}
      notice-artifact-id: ${{ steps.notice.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-release
      - name: Verify the exact prepared archive
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: python3 .github/scripts/archive_binding.py verify npm "$RUNNER_TEMP/npm-release"
      - name: Publish through the repository Trusted Publisher
        id: publication
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          PUBLICATION_MODE: ${{ vars.NPM_PUBLICATION_MODE }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive-name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
          APPROVAL_BATCH: ${{ inputs.approval-batch || vars.NPM_APPROVAL_BATCH }}
        run: |
          set -euo pipefail
          if test "$PUBLICATION_MODE" = direct; then
            npm publish "$RUNNER_TEMP/npm-release/$ARCHIVE_NAME" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
            python3 .github/scripts/archive_binding.py registry npm "$RUNNER_TEMP/npm-release"
          elif test -z "$PUBLICATION_MODE" || test "$PUBLICATION_MODE" = stage; then
            npm stage publish "$RUNNER_TEMP/npm-release/$ARCHIVE_NAME" --access public --provenance --ignore-scripts --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/npm-stage-response.json"
            python3 .github/scripts/stage_notification.py "$RUNNER_TEMP/npm-release" "$RUNNER_TEMP/npm-stage-response.json"
            rm -f "$RUNNER_TEMP/npm-stage-response.json"
          else
            echo 'Unknown NPM_PUBLICATION_MODE'; exit 1
          fi
          cat "$RUNNER_TEMP/npm-release/release-receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: notice
        if: steps.publication.outputs.stage-id != ''
        with:
          name: npm-stage-notice-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/stage-notification/
          if-no-files-found: error
          retention-days: 30
  notify:
    needs: publish
    if: needs.publish.outputs.stage-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.publish.outputs.notice-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-stage-notice
      - name: Notify the owner issue queue without npm credentials or approval authority
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ID: ${{ needs.publish.outputs.stage-id }}
        run: |
          set -euo pipefail
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$STAGE_ID in:body" --json number --jq 'length')
          if test "$count" = 0; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "[npm stage] Review $STAGE_ID" --body-file "$RUNNER_TEMP/npm-stage-notice/notice.md"
          fi
          cat "$RUNNER_TEMP/npm-stage-notice/notice.md" >> "$GITHUB_STEP_SUMMARY"
