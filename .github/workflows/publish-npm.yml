name: Release npm package from version tag
on:
  push:
    tags: ['v*', 'npm/**']
  pull_request:
    paths: ['.github/registry-release.json', '.github/scripts/release_plan.py', '.github/scripts/test_release_plan.py', '.github/scripts/archive_binding.py', '.github/scripts/test_archive_binding.py', '.github/workflows/publish-npm.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          python3 .github/scripts/test_release_plan.py
          python3 .github/scripts/test_archive_binding.py
  prepare:
    if: github.event_name != 'pull_request' && github.ref_type == 'tag' && github.event.repository.private == false
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-name: ${{ steps.archive.outputs.archive-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit the exact tag and successful default-branch CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_plan.py npm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0 pnpm@10.29.3
      - name: Build and pack the selected package without publication identity
        env:
          INSTALL_DIRECTORY: ${{ steps.plan.outputs.install-directory }}
          PACKAGE_DIRECTORY: ${{ steps.plan.outputs.directory }}
          NUXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          if test -f "$INSTALL_DIRECTORY/pnpm-lock.yaml"; then
            pnpm --dir "$INSTALL_DIRECTORY" install --frozen-lockfile --ignore-scripts
            pnpm --dir "$INSTALL_DIRECTORY" -r --include-workspace-root --if-present run build
          elif test -f "$INSTALL_DIRECTORY/package-lock.json"; then
            npm --prefix "$INSTALL_DIRECTORY" ci --ignore-scripts
            npm --prefix "$INSTALL_DIRECTORY" run build --if-present
          else
            echo 'A committed dependency lock is required'; exit 1
          fi
          git diff --exit-code
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm_config_ignore_scripts=true pnpm --dir "$PACKAGE_DIRECTORY" pack --pack-destination "$RUNNER_TEMP/npm-release"
      - name: Bind archive identity and digest
        id: archive
        run: python3 .github/scripts/archive_binding.py prepare npm "$RUNNER_TEMP/npm-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-public
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.15.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global --ignore-scripts npm@12.2.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-release
      - name: Verify the exact prepared archive
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: python3 .github/scripts/archive_binding.py verify npm "$RUNNER_TEMP/npm-release"
      - name: Publish through the repository Trusted Publisher
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
          PUBLICATION_MODE: ${{ vars.NPM_PUBLICATION_MODE }}
          ARCHIVE_NAME: ${{ needs.prepare.outputs.archive-name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: |
          set -euo pipefail
          if test "$PUBLICATION_MODE" = direct; then
            npm publish "$RUNNER_TEMP/npm-release/$ARCHIVE_NAME" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
            python3 .github/scripts/archive_binding.py registry npm "$RUNNER_TEMP/npm-release"
          elif test -z "$PUBLICATION_MODE" || test "$PUBLICATION_MODE" = stage; then
            npm stage publish "$RUNNER_TEMP/npm-release/$ARCHIVE_NAME" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
            echo 'Stage created; formal publication still requires maintainer approval on npm.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unknown NPM_PUBLICATION_MODE'; exit 1
          fi
          cat "$RUNNER_TEMP/npm-release/release-receipt.json" >> "$GITHUB_STEP_SUMMARY"
