name: Native worker and provider archive consumer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Use public registry configuration
        run: |
          : > "$RUNNER_TEMP/user.npmrc"
          : > "$RUNNER_TEMP/global.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/user.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/global.npmrc" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/public-cache" >> "$GITHUB_ENV"
      - name: Prepare the independently owned sandbox
        run: |
          git init "$RUNNER_TEMP/sandbox"
          git -C "$RUNNER_TEMP/sandbox" fetch --depth=1 https://github.com/crowsi-net/crowsi-network-sandbox 78c98727d54ff4a40e61225b456fd581d5da4b16
          git -C "$RUNNER_TEMP/sandbox" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sandbox" rev-parse HEAD)" = 78c98727d54ff4a40e61225b456fd581d5da4b16
          cd "$RUNNER_TEMP/sandbox"
          bash scripts/ci/build-bubblewrap.sh
          rustup toolchain install 1.97 --profile minimal
          cargo +1.97 build --locked --example execute-port-worker
          echo "CROWSI_WORKLOAD_HELPER=$RUNNER_TEMP/sandbox/target/debug/examples/execute-port-worker" >> "$GITHUB_ENV"
      - name: Build the source owned package
        working-directory: packages/crowsi-provider-http-transport
        run: |
          npm ci --ignore-scripts --workspaces=false
          npm run check --workspaces=false
          npm test --workspaces=false
      - name: Verify independent public archive imports
        run: node .github/scripts/provider-consumer.mjs
